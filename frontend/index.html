<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
    
        <title>Forest Crawler</title>
    
        <link rel="stylesheet" href="./style.css">
        <script src="./start.js" defer></script>
        <script src="./auth.js" defer></script>
    </head>
    <body>
        <div class = "login-container">
            <div class="login-title">Login to Forest Crawler</div>
        </div>
        <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
            <div class="login-form">
                <input class="form-text"
                 type="text" 
                 id="username" 
                 name="username" 
                 placeholder="Username" 
                 required>
                <input class="form-text" 
                type="text" 
                id="password" 
                name="password" 
                placeholder="Password" 
                required>
                <div class="login-row">
                <label class="remember-label" for="remember">
                    <input class="remember-input" type="checkbox" id="remember" name="remember">
                    Remember me!
                </label>
            </div>
            <p class="login-error" id="login-error" role="alert" hidden></p>
            <button class="btn-primary" type="submit">Login</button>
            <div class="login-divider">
                <span>OR</span>
            </div>
            <a class="btn-primary" href="signup.html">Sign Up</a>
            </div>
        </form>
    </body>
</html>
