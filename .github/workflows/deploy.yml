
name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "${{ secrets.DROPLET_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "set -e
             cd /root/Mern-Stack-Project

             git fetch origin main
             git reset --hard origin/main

             cd backend
             npm ci

             cd ../frontend
             npm ci
             npm run build

             # Apache serves the pages from its own folder, not frontend/dist, so copy the build there.
             COPIED=no
             for DOCROOT in \$(grep -lis 'mern.alex84plus.xyz' /etc/apache2/sites-enabled/* | xargs -r grep -hiE '^[[:space:]]*DocumentRoot[[:space:]]' | awk '{print \$2}' | tr -d '\"' | sort -u); do
               if [ -f \"\$DOCROOT/index.html\" ]; then
                 cp -a dist/. \"\$DOCROOT/\" && COPIED=yes && echo \"Copied the build into \$DOCROOT\" || echo \"Could not copy the build into \$DOCROOT\"
               else
                 echo \"Skipped \$DOCROOT, which has no index.html\"
               fi
             done
             [ \"\$COPIED\" = yes ] || echo 'Found no Apache folder to copy the build into'

             pm2 restart game-api

             echo 'Deployment complete'"
